# Railway config-as-code — Hermes Agent
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Dashboard/proxy expose HTTP on :3000; gateway (bot mode) has no HTTP,
# so the healthcheck only matters for dashboard/proxy surfaces.
healthcheckPath = "/"
healthcheckTimeout = 300

# Persistent volume so sessions, memory, skills and config survive redeploys
[[mounts]]
name = "hermes-data"
path = "/data"
