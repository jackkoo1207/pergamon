# Railway config-as-code — Hermes Agent
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# NOTE: no healthcheckPath — chat/gateway surfaces expose no HTTP endpoint.
# The container stays "Running" while the process is alive (gateway) or
# completes (chat one-shot). Use dashboard/proxy surfaces if you want an
# HTTP healthcheck on :3000.

# Persistent volume so sessions, memory, skills and config survive redeploys
[[mounts]]
name = "hermes-data"
path = "/data"
